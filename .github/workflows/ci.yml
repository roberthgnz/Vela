name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  interface:
    name: Interface (types and unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # pnpm is installed in the next step; automatic caching would look for it first.
          package-manager-cache: false
      - name: Install pnpm
        run: npm install --global "pnpm@$(node -p "require('./package.json').packageManager.split('@')[1]")"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

  desktop:
    name: Desktop (Rust on ${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
          - name: Linux
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev libdbus-1-dev
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # tauri-build checks that the frontend bundle directory exists.
      - name: Placeholder frontend
        run: mkdir -p dist && echo '<!doctype html>' > dist/index.html
      - run: cargo fmt --check --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
