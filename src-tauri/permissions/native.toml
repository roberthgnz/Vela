[[permission]]
identifier = "allow-native-transport"
description = "Allow the main window to request addon and account data, keep its Stremio session in the OS credential store, explicitly launch links or a configured player, and check for and install signed updates."
commands.allow = ["request_json", "post_json", "request_text", "request_bytes", "request_range", "open_external", "launch_external_player", "secret_get", "secret_set", "secret_delete", "update_check", "update_install"]

[[permission]]
identifier = "allow-downloads"
description = "Allow the main window to download video files to the Vela folder in Downloads, pause and resume them, delete them and show them in Explorer (only inside that folder)."
commands.allow = ["download_folder", "download_start", "download_cancel", "download_remove", "download_reveal"]

[[permission]]
identifier = "allow-desktop-services"
description = "Allow the main window to start the streaming server Stremio installs (stopped again when Vela exits) and to read and save the hardware video decoding choice, applied at the next start."
commands.allow = ["service_installed", "service_start", "hardware_decoding_get", "hardware_decoding_set"]

[[permission]]
identifier = "allow-storage"
description = "Allow the main window to read and write Vela's own database in the app data folder, make a copy of it and show the folder with its backups in Explorer."
commands.allow = ["storage_load", "storage_write", "storage_info", "storage_backup", "storage_reveal"]

[[permission]]
identifier = "allow-logging"
description = "Allow the main window to append lines to Vela's own log file, read its end for the diagnostic report and show the folder with the log files in Explorer."
commands.allow = ["log_write", "log_tail", "log_folder", "log_reveal", "log_save_report"]

[[permission]]
identifier = "allow-torrents"
description = "Allow the main window to open torrents with Vela's own engine, read their swarm statistics and release them; the files are served only on 127.0.0.1 behind a secret path and deleted afterwards."
commands.allow = ["torrent_prepare", "torrent_stats", "torrent_release"]

[[permission]]
identifier = "allow-embedded-mpv"
description = "Allow the main window to play a source with the libmpv already installed on the machine (Stremio's or next to mpv.exe), drawn in a child window over the video area, and to place, focus, pause and close it."
commands.allow = ["mpv_embedded_library", "mpv_embedded_open", "mpv_embedded_place", "mpv_embedded_focus", "mpv_embedded_command", "mpv_embedded_close"]

[[permission]]
identifier = "allow-desktop-integration"
description = "Allow the main window to read the link Vela was opened with, show or remove the tray icon (closing to it), and register or give back stremio:// links for the current user."
commands.allow = ["link_pending", "tray_set", "stremio_links_get", "stremio_links_set"]
