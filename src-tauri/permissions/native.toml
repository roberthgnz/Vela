[[permission]]
identifier = "allow-media-proxy"
description = "Prepare and stop the one-source local header proxy used by the built-in player."
commands.allow = ["media_proxy_start", "media_proxy_stop"]

[[permission]]
identifier = "allow-native-transport"
description = "Allow the main window to request addon and account data, keep its Stremio session in the OS credential store, explicitly launch links or a configured player (and tell which kind it is and send it subtitle URLs found after it started), and check for and install signed updates."
commands.allow = ["request_json", "post_json", "request_text", "request_bytes", "request_range", "open_external", "launch_external_player", "external_player_kind", "external_player_subtitles", "secret_get", "secret_set", "secret_delete", "update_check", "update_install"]

[[permission]]
identifier = "allow-downloads"
description = "Allow the main window to download video files to the Vela folder in Downloads, pause and resume them, delete them and show them in Explorer (only inside that folder)."
commands.allow = ["download_folder", "download_start", "download_cancel", "download_remove", "download_reveal"]

[[permission]]
identifier = "allow-desktop-services"
description = "Allow the main window to start the streaming server Stremio installs (stopped again when Vela exits) and to read and save the hardware video decoding choice, applied at the next start."
commands.allow = ["service_installed", "service_start", "hardware_decoding_get", "hardware_decoding_set"]

[[permission]]
identifier = "allow-storage"
description = "Allow the main window to read and write Vela's own database in the app data folder, create and preview its local backups, restore a validated backup with a safety copy, and show the backups folder in Explorer."
commands.allow = ["storage_load", "storage_write", "storage_info", "storage_backup", "storage_backup_preview", "storage_restore", "storage_reveal"]

[[permission]]
identifier = "allow-logging"
description = "Allow the main window to append lines to Vela's own log file, read its end for the diagnostic report and show the folder with the log files in Explorer."
commands.allow = ["log_write", "log_tail", "log_folder", "log_reveal", "log_save_report"]

[[permission]]
identifier = "allow-torrents"
description = "Allow the main window to start Vela's own torrent engine ahead of time, open torrents with it, read their swarm statistics and release them; the files are served only on 127.0.0.1 behind a secret path and deleted afterwards."
commands.allow = ["torrent_warm", "torrent_prepare", "torrent_stats", "torrent_release"]

[[permission]]
identifier = "allow-embedded-mpv"
description = "Allow the main window to play a source with a libmpv on the machine (next to mpv.exe, Stremio's, or the one Vela downloaded), drawn in a child window over the video area, to place, focus, pause and close it, and to add subtitle URLs found after it opened. It may also download the pinned LGPL libmpv build (checked against its SHA-256) into Vela's own data folder, cancel that download and delete it."
commands.allow = ["mpv_embedded_library", "mpv_embedded_open", "mpv_embedded_place", "mpv_embedded_focus", "mpv_embedded_command", "mpv_embedded_subtitles", "mpv_embedded_close", "mpv_install_info", "mpv_install", "mpv_install_cancel", "mpv_uninstall"]

[[permission]]
identifier = "allow-desktop-integration"
description = "Allow the main window to read the link Vela was opened with, show or remove the tray icon (closing to it), and register or give back stremio:// links for the current user."
commands.allow = ["link_pending", "tray_set", "stremio_links_get", "stremio_links_set"]
