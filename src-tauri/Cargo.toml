[package]
name = "vela"
version = "0.2.0"
description = "Desktop client compatible with Stremio addons"
authors = ["Vela contributors"]
edition = "2024"
rust-version = "1.90"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "gzip", "brotli", "deflate"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }
url = "2"
webbrowser = "=1.2.5"
tauri-plugin-window-state = "=2.5.0"

[target.'cfg(windows)'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "net", "io-util"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
panic = "abort"
