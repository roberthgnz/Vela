[package]
name = "vela"
version = "1.0.0"
description = "Desktop client compatible with Stremio addons"
authors = ["Vela contributors"]
license = "MIT"
repository = "https://github.com/roberthgnz/Vela"
edition = "2024"
rust-version = "1.90"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["protocol-asset", "tray-icon"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "gzip", "brotli", "deflate"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "process", "net", "io-util", "macros", "fs"] }
url = "2"
webbrowser = "=1.2.5"
tauri-plugin-window-state = "=2.5.0"
tauri-plugin-updater = { version = "=2.13.1", default-features = false, features = ["rustls-tls"] }
rusqlite = { version = "=0.41.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
librqbit = { version = "=9.1.0", default-features = false, features = ["rust-tls"] }
libloading = "0.8"
tauri-plugin-single-instance = "=2.5.5"

[target.'cfg(windows)'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Registry"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "net", "io-util"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
panic = "unwind"
